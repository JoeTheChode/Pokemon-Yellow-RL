# systemd drop-in: resource ceiling for pokemon-train.service (sver-core-01)
# ═══════════════════════════════════════════════════════════════════
# INSTALL:
#   sudo mkdir -p /etc/systemd/system/pokemon-train.service.d
#   sudo cp pokemon-train-resources.conf \
#           /etc/systemd/system/pokemon-train.service.d/resources.conf
#   sudo systemctl daemon-reload
#   # verify the RUNNING cgroup picked it up (daemon-reload re-applies for
#   # running units; no restart, so in-flight training is not lost):
#   cat /sys/fs/cgroup/system.slice/pokemon-train.service/cpu.max
#
# REMOVE:
#   sudo rm -- /etc/systemd/system/pokemon-train.service.d/resources.conf
#   sudo systemctl daemon-reload
#   # Keep the other drop-ins: they preserve the training frontier, worker
#   # topology and stream configuration.
#
# WHY THIS EXISTS
# ───────────────
# pokemon-train trains SVER Plays, so it is legitimate work and Roadmap D3's
# "evict it" framing is wrong (Teardown H-03 calls it an "unrelated ML
# training job"; it is not unrelated). What was real is the contention risk,
# and the measurement on 2026-08-30 found an inversion:
#
#   pokemon-train.service   CPUQuota=infinity  MemoryMax=infinity  Nice=0
#   sver-backend container  capped at 2 CPUs and 4 GB
#
# The workload serving users was the only one with a ceiling, and the two
# competed at equal scheduling priority. Halving the trainer's agents brought
# load 43-47 -> ~23.8 on 48 cores, but that is a number somebody remembered,
# not a property of the system. This file makes it structural.
#
# THE NUMBERS, AND WHY THESE ONES
# ───────────────────────────────
# Measured 2026-08-30 on a 48-core / 125 GB host, after Joe halved the agents:
#   trainer CPU, average   17 cores   (cgroup cpu.stat usage_usec over 15s with
#                                      the cap lifted — this is true demand)
#   trainer CPU, ps pcpu   21.5-24.9 cores (process-lifetime average; NOT a
#                                      current reading, and it misled the first
#                                      version of this file)
#   trainer memory         18.5 GB    (cgroup memory.current, authoritative;
#                                      per-process RSS sums to 24 GB because
#                                      forked workers share pages)
#
# A FIRST ATTEMPT AT CPUQuota=2400% THROTTLED 93% OF PERIODS (nr_throttled 219
# of nr_periods 236) even though average demand was 17 cores — well under 24.
# The cause is burstiness, not demand: CPU quota is enforced per 100 ms window,
# and 55 workers that spike together blow through the per-window ceiling while
# averaging far below it. Raising the quota is the fix; the alternative,
# CPUQuotaPeriodSec=1s, smooths bursts but lets one window monopolise more
# cores, and buys nothing here because the box is not short of CPU.
#
# Every limit sits well ABOVE measured demand on purpose. The goal is to bound
# a runaway, not to slow today's training run — a ceiling that throttles normal
# operation gets raised or removed by the next person who hits it.
#
#   CPUQuota=3600%   At most 36 cores' CPU time per quota period, with room for
#                    bursts. This does NOT cap Linux load average: runnable
#                    threads can still be queued while the cgroup is throttled.
#   CPUWeight=20     Default is 100. Reduces the trainer's relative CPU share
#                    under contention; it is not a strict API priority or a
#                    latency guarantee. Verify API latency separately.
#   MemoryHigh=48G   Soft limit — throttles allocation and reclaims. Hitting
#                    this slows the trainer; it does not kill it.
#   MemoryMax=64G    Hard backstop, ~3.5x current. Deliberately far above
#                    MemoryHigh: crossing MemoryMax means an OOM kill, which
#                    destroys an in-progress training run, so it must only fire
#                    on genuine runaway and never as routine back-pressure.

[Service]
CPUQuota=3600%
CPUWeight=20
MemoryHigh=48G
MemoryMax=64G
