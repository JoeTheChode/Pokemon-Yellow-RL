# Frontier durability (CxC 2026-09-03/04). A quest-zero reset quarantines the
# durable full-game frontier back to phase 0; re-climbing to phase ~200 takes
# 5-7h. An automated fix/deploy loop finishing every patch with a "proven
# fresh pass" (often via --allow-rapid, which punched through the phase-floor
# guard) held the tracker in the early game for a week.
#
#   POKEMON_KEEP_EXISTING_SWARM_FRONTIER=1
#       Hard stop: train.py skips ensure_quest_zero_mastery_session() entirely,
#       so NO reset_id -- and no --allow-rapid -- can quarantine the frontier.
#       validate_or_quarantine_swarm_frontier() still runs, so a genuinely
#       corrupt frontier is still quarantined. To run a DELIBERATE fresh pass:
#       clear this var (edit this file or `systemctl set-environment
#       POKEMON_KEEP_EXISTING_SWARM_FRONTIER=0`), restart, then restore it.
#   POKEMON_QUEST_ZERO_MAX_RESET_PHASE=40
#       Secondary guard (used if KEEP_EXISTING is ever cleared): quest_phase
#       at/above which a reset_id change is declined -> resume. 0 disables it.
[Service]
Environment=POKEMON_KEEP_EXISTING_SWARM_FRONTIER=1
Environment=POKEMON_QUEST_ZERO_MAX_RESET_PHASE=40
