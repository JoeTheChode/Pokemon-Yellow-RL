[Service]
Environment=POKEMON_N_ENVS=1

# run_train_ovh.sh hard-codes POKEMON_N_ENVS=48, so the production service
# must invoke the venv interpreter directly for a true one-worker topology.
# The base unit already supplies POKEMON_VEC_ENV=subproc and PYTHONUNBUFFERED.
ExecStart=
ExecStart=/home/ubuntu/pokemon-rl/.venv/bin/python /home/ubuntu/pokemon-rl/train.py
