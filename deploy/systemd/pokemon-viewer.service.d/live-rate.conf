[Service]
# Poll the trainer's per-env position files frequently enough that the viewer
# contributes minimal latency. The trainer's own emit interval
# (POKEMON_STREAM_UPLOAD_INTERVAL) is staged to drop from 10 to 2 on its next
# restart, raising the source rate from ~4.8 Hz toward ~24 Hz -- 60 Hz here
# keeps the viewer comfortably ahead of that once it lands, without the
# trainer restart itself being required for this bump to take effect now.
Environment=POKEMON_VIEWER_FEED_HZ=60
